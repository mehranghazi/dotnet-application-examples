<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinKestrelApp</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#647086; --accent:#5b4bdb; --border:#e3e6ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151b; --card:#1b1f27; --fg:#e8ebf1; --muted:#98a1b3; --accent:#9d92ff; --border:#2a303b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width: 760px; margin: 48px auto; padding: 0 16px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .sub { color: var(--muted); margin: 0 0 28px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
    .card h2 { margin:0 0 12px; font-size:1rem; }
    table { width:100%; border-collapse:collapse; font-size:.95rem; }
    td { padding:6px 0; border-bottom:1px solid var(--border); vertical-align:top; }
    td:first-child { color:var(--muted); width:40%; }
    tr:last-child td { border-bottom:none; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    input { flex:1; min-width:160px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--fg); font:inherit; }
    button { padding:9px 16px; border-radius:8px; border:none; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    #greet { margin-top:12px; color:var(--muted); min-height:1.4em; }
    .ok { color:#1f9d55; font-weight:600; }
  </style>
</head>
<body>
<main>
  <h1>WinKestrelApp</h1>
  <p class="sub">ASP.NET Core on Kestrel — running without IIS.</p>

  <div class="card">
    <h2>Server info <span id="status"></span></h2>
    <table id="info"><tr><td>Loading…</td><td></td></tr></table>
  </div>

  <div class="card">
    <h2>Try the API</h2>
    <div class="row">
      <input id="name" placeholder="Your name" value="Shayan">
      <button id="go">Say hello</button>
    </div>
    <div id="greet"></div>
  </div>
</main>
<script>
  const labels = {
    server: "Web server", os: "Operating system", framework: ".NET runtime",
    environment: "Environment", startedAt: "Started", serverTime: "Server time"
  };
  async function loadInfo() {
    try {
      const r = await fetch("api/info");
      const d = await r.json();
      const t = document.getElementById("info");
      t.innerHTML = "";
      for (const [k, v] of Object.entries(d)) {
        const tr = t.insertRow();
        tr.insertCell().textContent = labels[k] ?? k;
        const val = (k === "startedAt" || k === "serverTime") ? new Date(v).toLocaleString()
                  : typeof v === "boolean" ? (v ? "Yes" : "No") : v;
        tr.insertCell().textContent = val;
      }
      document.getElementById("status").innerHTML = '<span class="ok">● online</span>';
    } catch (e) {
      document.getElementById("status").textContent = "(unreachable)";
    }
  }
  document.getElementById("go").onclick = async () => {
    const n = document.getElementById("name").value.trim() || "world";
    const r = await fetch("api/hello/" + encodeURIComponent(n));
    document.getElementById("greet").textContent = (await r.json()).message;
  };
  loadInfo();
  setInterval(loadInfo, 5000);
</script>
</body>
</html>
